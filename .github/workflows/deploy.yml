name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Deployments parallel — Terraform-State und S3-Sync vertragen das nicht.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.14.8

jobs:
  deploy:
    name: Trivy → Terraform → Build → S3 → CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trivy direkt aus dem GitHub-Release installieren: Das Install-Skript von
      # setup-trivy lädt über get.trivy.dev, die Domain löst seit 11/2026 nicht mehr
      # auf (aquasecurity/trivy#11537). Hash fest eingetragen gegen Supply-Chain-Risiken.
      - name: Trivy installieren
        env:
          TRIVY_VERSION: 0.70.0
          TRIVY_SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          curl -fsSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin/trivy-bin"
          tar -xzf trivy.tar.gz -C "$HOME/.local/bin/trivy-bin" trivy
          rm trivy.tar.gz
          echo "$HOME/.local/bin/trivy-bin" >> "$GITHUB_PATH"

      - name: Security-Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: AWS-Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=infra init -input=false

      - name: Terraform Apply
        run: terraform -chdir=infra apply -input=false -auto-approve

      - name: Terraform-Outputs auslesen
        id: tf
        run: |
          echo "bucket=$(terraform -chdir=infra output -raw site_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(terraform -chdir=infra output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build (Angular)
        run: |
          npm ci
          npm run build

      - name: S3-Sync
        run: |
          # Gehashte Assets: ein Jahr immutable cachen (HTML, robots.txt und sitemap.xml ausgenommen)
          aws s3 sync dist/prime-ux/browser "s3://${{ steps.tf.outputs.bucket }}" \
            --delete \
            --exclude "*.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --cache-control "public,max-age=31536000,immutable"
          # Prerenderte Seiten (index.html je Route): nie cachen, damit neue Deployments sofort greifen
          aws s3 sync dist/prime-ux/browser "s3://${{ steps.tf.outputs.bucket }}" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache"
          # robots.txt und sitemap.xml: kurz cachen, damit Crawler Änderungen zeitnah sehen
          aws s3 sync dist/prime-ux/browser "s3://${{ steps.tf.outputs.bucket }}" \
            --exclude "*" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --cache-control "public,max-age=3600"

      - name: CloudFront-Cache invalidieren
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution }}" \
            --paths "/*"
